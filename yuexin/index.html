<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<title>月薪猫</title>
<style>
  :root{
    --bg:#12141A;
    --panel:#191D27;
    --line:#2C3345;
    --text:#F2F5FF;
    --muted:#8B94AB;
    --accent:#4D6BFE;
    /* 对话框配色:和像素图里的描边/白底一致 */
    --bub-fill:#FDFCFC;
    --bub-line:#67423A;
    --bub-ink:#2A1B16;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei UI","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
    overflow:hidden;
  }

  /* ---------- 第一屏:填名字的面板 ---------- */
  #panel{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:var(--bg);
    transition:opacity .35s ease;
  }
  #panel.hide{opacity:0;pointer-events:none;}
  .card{
    width:100%;max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px 22px 20px;
  }
  .card h1{margin:0 0 20px;font-size:21px;font-weight:700;}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .field label{font-size:13px;color:var(--muted);white-space:nowrap;}
  .field input{
    flex:1;min-width:0;font:inherit;font-size:15px;
    color:var(--text);background:#0F1218;
    border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  button{
    width:100%;font:inherit;font-weight:700;font-size:16px;
    border:0;border-radius:14px;padding:15px;
    background:var(--accent);color:#fff;cursor:pointer;
  }
  button:active{opacity:.85;}

  /* ---------- 第二屏:猫 + 对话框 ---------- */
  #show{
    position:fixed;inset:0;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:18px;
  }
  #show.on{display:flex;}
  #stage{
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    max-width:100%;
    touch-action:manipulation;
  }

  /* 漫画对话框:圆角矩形 + 指向下方的小尾巴 */
  #bubble{
    position:relative;
    background:var(--bub-fill);
    border:3px solid var(--bub-line);
    border-radius:14px;
    padding:10px 16px 11px;
    max-width:92vw;
  }
  #bubble .txt{
    display:block;
    font-weight:700;
    color:var(--bub-ink);
    line-height:1.35;
    white-space:nowrap;
    letter-spacing:1px;
  }

  /* 返回键:固定在底部中间,不遮挡猫 */
  #back{
    position:fixed;
    left:50%;
    bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:auto;                 /* 不加这句会被拉伸到超出视口 */
    white-space:nowrap;
    font:inherit;font-size:14px;font-weight:600;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 22px;
    cursor:pointer;
    opacity:.85;
  }
  #back:active{opacity:1;background:#222836;}

  /* 尾巴:一个旋转 45 度的方块,只有下半截露在对话框外面,看起来就是向下的尖角 */
  #bubble .tail{
    position:absolute;
    left:34px;
    bottom:-8px;
    width:17px;
    height:17px;
    background:var(--bub-fill);
    border-right:3px solid var(--bub-line);
    border-bottom:3px solid var(--bub-line);
    transform:rotate(45deg);
    border-bottom-right-radius:3px;
  }
</style>
</head>
<body>

<!-- 第一屏 -->
<div id="panel">
  <div class="card">
    <h1>温馨提示</h1>

    <div class="field">
      <label for="name">名字</label>
      <input id="name" type="text" autocomplete="off" maxlength="12">
    </div>

    <button id="go">开始</button>
  </div>
</div>

<!-- 第二屏 -->
<div id="show">
  <div id="bubble">
    <span class="txt" id="bubbleText">你好臭~</span>
    <span class="tail" aria-hidden="true"></span>
  </div>
  <canvas id="stage"></canvas>
  <button id="back">← 返回</button>
</div>

const PAL = {};
for (const k in CAT.palette) {
  const v = CAT.palette[k];
  if (!v) continue;
  PAL[k] = [parseInt(v.slice(1, 3), 16), parseInt(v.slice(3, 5), 16), parseInt(v.slice(5, 7), 16)];
}

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const panel = document.getElementById('panel');
const show = document.getElementById('show');
const bubbleText = document.getElementById('bubbleText');
const nameInput = document.getElementById('name');

/* ---------- 名字合成 ---------- */
function makeMessage(name) {
  const n = (name || '').trim();
  return n ? (n + ',你好臭~') : '你好臭~';
}

/**
 * 让文字塞进屏幕宽度:从 30px 起,放不下就逐级缩小。
 *
 * 网页版的对话框是网页元素画的,能自由伸缩,所以没有"最多 2 个字"那种硬限制。
 * 实测(手机屏宽 390px,气泡内边距+边框 38px):
 *     6 字以内  30px  很舒服
 *     8 字      28px
 *    10 字      24px
 *    12 字      21px  仍然清楚
 *    20 字      14px  技术上限,但已经偏小了
 * 所以输入框限到 12 字,兼顾长度和可读性。
 */
function fitBubbleText() {
  const maxW = Math.min(window.innerWidth * 0.94, 560) - 44;   // 减去气泡内边距
  let size = 30;
  bubbleText.style.fontSize = size + 'px';
  let guard = 0;
  while (bubbleText.scrollWidth > maxW && size > 12 && guard++ < 60) {
    size -= 1;
    bubbleText.style.fontSize = size + 'px';
  }
  /* 极端情况:缩到下限还是放不下,就允许换行,免得溢出屏幕 */
  bubbleText.style.whiteSpace = bubbleText.scrollWidth > maxW ? 'normal' : 'nowrap';
}

/* ---------- 画布 ---------- */
function drawFrame(frame) {
  const h = frame.length, w = frame[0].length;
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let y = 0; y < h; y++) {
    const row = frame[y];
    for (let x = 0; x < w; x++) {
      const rgb = PAL[row[x]];
      const i = (y * w + x) * 4;
      if (rgb) {
        d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255;
      } else {
        /* 透明背景显示成页面底色 */
        d[i] = 18; d[i + 1] = 20; d[i + 2] = 26; d[i + 3] = 255;
      }
    }
  }
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  tmp.getContext('2d').putImageData(img, 0, 0);

  /* 给对话框留出空间,猫最多占高度的 74% */
  const scale = Math.max(1, Math.floor(Math.min(
    window.innerWidth * 0.92 / w,
    window.innerHeight * 0.74 / h
  )));
  const W = w * scale, H = h * scale;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(tmp, 0, 0, w, h, 0, 0, W, H);
}

let frameIndex = 0;
let fps = 12;
let playing = true;
let last = 0;
let acc = 0;

function loop(now) {
  if (!last) last = now;
  const dt = now - last;
  last = now;
  if (playing) {
    acc += dt;
    const step = 1000 / fps;
    while (acc >= step) {
      acc -= step;
      frameIndex = (frameIndex + 1) % CAT.frames.length;
    }
    drawFrame(CAT.frames[frameIndex]);
  }
  requestAnimationFrame(loop);
}

/* ---------- 交互 ---------- */
function start() {
  bubbleText.textContent = makeMessage(nameInput.value);
  fitBubbleText();
  panel.classList.add('hide');
  show.classList.add('on');
  frameIndex = 0;
  drawFrame(CAT.frames[0]);
}

/** 返回第一屏,可以重新填名字。名字保留在输入框里,方便改。 */
function back() {
  show.classList.remove('on');
  panel.classList.remove('hide');
  nameInput.focus();
}

document.getElementById('go').addEventListener('click', start);
document.getElementById('back').addEventListener('click', back);
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') start();
});

/* 点画面暂停,空格暂停,上下键调速 */
cv.addEventListener('click', () => { playing = !playing; });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; }
  else if (e.code === 'ArrowUp') fps = Math.min(30, fps + 2);
  else if (e.code === 'ArrowDown') fps = Math.max(4, fps - 2);
  /* 在猫那一屏按 Esc 或退格,也当返回 */
  else if (e.code === 'Escape' && show.classList.contains('on')) back();
});
window.addEventListener('resize', () => {
  if (show.classList.contains('on')) { fitBubbleText(); drawFrame(CAT.frames[frameIndex]); }
});

requestAnimationFrame(loop);
</script>
